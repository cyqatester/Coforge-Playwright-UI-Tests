
name: Coforge Playwright UI Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  dev:
    name: UI tests - DEV
    runs-on: ubuntu-24.04
    environment: dev

    env:
      TEST_ENV: dev
      BASE_URL_DEV: ${{ vars.BASE_URL || 'https://www.coforge.com/' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run DEV tests
        run: npm run test:dev

      - name: Upload DEV test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-dev-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  qa:
    name: UI tests - QA
    runs-on: ubuntu-24.04
    environment: qa
    needs: dev

    env:
      TEST_ENV: qa
      BASE_URL_QA: ${{ vars.BASE_URL || 'https://www.coforge.com/' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run QA tests
        run: npm run test:qa

      - name: Upload QA test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-qa-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  prod:
    name: UI tests - PROD
    runs-on: ubuntu-24.04
    environment: prod
    needs: qa

    env:
      TEST_ENV: prod
      BASE_URL_PROD: ${{ vars.BASE_URL || 'https://www.coforge.com/' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run PROD tests
        run: npm run test:prod

      - name: Upload PROD test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-prod-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7